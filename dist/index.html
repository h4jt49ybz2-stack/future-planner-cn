<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">↗</div><div><div class="brand-name">向前</div><div class="brand-sub">CAREER COMPASS</div></div></div>
    <div class="side-label">工作台</div>
    <nav class="nav" aria-label="主导航">
      <button class="active" data-page="overview"><span class="nav-icon">⌂</span>规划概览</button>
      <button data-page="profile"><span class="nav-icon">◎</span>我的画像</button>
      <button data-page="paths"><span class="nav-icon">◇</span>路径方案</button>
      <button data-page="jobs"><span class="nav-icon">▤</span>岗位筛选</button>

  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb">向前 <span style="color:#b0bab3">/</span> <strong id="crumbTitle">规划概览</strong></div><div class="top-actions"><div class="save-state"><span class="save-dot"></span><span id="saveLabel">本地保存已开启</span></div><button class="btn" data-action="print">↗ <span>打印 / 保存 PDF</span></button></div></header>
    <div class="content" id="content"></div>
  </main>
</div>
<dialog id="screenDialog" class="modal"><div class="modal-card" id="screenDialogBody"></div></dialog>
<dialog id="newJobDialog" class="modal"><form class="modal-card" id="newJobForm"><div class="modal-head"><div><div class="eyebrow">岗位库</div><h2>添加目标岗位</h2><p>记录招聘页面的真实要求，之后逐项核对。</p></div><button class="icon-button" type="button" data-action="close-job" aria-label="关闭">×</button></div><div class="form-grid" style="margin-top:18px"><div class="field"><label for="jCompany">公司</label><input id="jCompany" name="company" required placeholder="例如：某某集团"></div><div class="field"><label for="jTitle">岗位名称</label><input id="jTitle" name="title" required placeholder="例如：投资分析师"></div><div class="field"><label for="jLocation">城市 / 市场</label><input id="jLocation" name="location" placeholder="例如：上海 / London"></div><div class="field"><label for="jDeadline">截止日期</label><input id="jDeadline" name="deadline" placeholder="招聘公告日期或未注明"></div><div class="field full"><label for="jRequirements">简历筛选必填条件</label><textarea id="jRequirements" name="requirements" placeholder="学历/专业、毕业届别、语言、工作许可、技能、资格证等；每项单独一行"></textarea></div><div class="field full"><label for="jLink">官方招聘链接</label><input id="jLink" name="link" type="url" placeholder="https://..."></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button type="button" class="btn" data-action="close-job">取消</button><button type="submit" class="btn btn-primary">保存岗位</button></div></form></dialog>
<input type="file" id="csvFile" accept=".csv,.txt,text/csv" class="hidden" aria-label="导入岗位 CSV">
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  const KEY='xiangqian-career-planner-v1';
  const baseState={profile:{name:'',school:'',degree:'',major:'',gradDate:'',gpa:'',language:'',workAuth:'',targetMarkets:'',experience:'',skills:'',certificates:'',salary:'',studyBudget:'',workStyle:'',risk:'',personalNote:'',familyNote:'',influence:28,routeGoals:[],directions:[],familyPriorities:[]},manualChecks:{education:'verify',graduation:'verify',authorization:'verify',location:'verify',academic:'verify',language:'verify',skills:'verify',qualifications:'verify',experience:'verify',materials:'verify'},jobs:[],jobChecks:{},savedJobs:[],search:'',market:'all',jobFilter:'all',doneTasks:[]};
  const titles={overview:'规划概览',profile:'我的画像',paths:'路径方案',jobs:'岗位筛选',plan:'行动计划'};
  const clone=o=>JSON.parse(JSON.stringify(o));
  let state=loadState(), page='overview', toastTimer;
  function loadState(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(!raw)return clone(baseState);return {...clone(baseState),...raw,profile:{...clone(baseState.profile),...(raw.profile||{})},manualChecks:{...clone(baseState.manualChecks),...(raw.manualChecks||{})},jobChecks:raw.jobChecks||{},jobs:Array.isArray(raw.jobs)?raw.jobs:[],savedJobs:Array.isArray(raw.savedJobs)?raw.savedJobs:[],doneTasks:Array.isArray(raw.doneTasks)?raw.doneTasks:[]}}catch{return clone(baseState)}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveLabel').textContent='刚刚保存到此设备';updateMini()}catch{document.getElementById('saveLabel').textContent='当前会话保存中'}}
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
  function checked(list,value){return (list||[]).includes(value)?'checked':''}
  function fieldValue(name){return esc(state.profile[name]||'')}
  function navTo(next){page=next;render();window.scrollTo({top:0,behavior:'smooth'})}
  function updateMini(){const p=state.profile;const checks=[p.school,p.degree,p.major,p.gradDate,p.experience,p.skills,p.certificates,p.targetMarkets,p.personalNote,p.familyNote].filter(v=>String(v||'').trim()).length;const percent=Math.round(checks/10*100);document.getElementById('miniProgress').style.width=percent+'%';document.getElementById('miniPercent').textContent=percent+'%';document.getElementById('miniLabel').textContent=p.name?String(p.name)+' 的生涯档案':'先从你的经历开始'}
  function profileScore(){const p=state.profile;const fields=[p.school,p.degree,p.major,p.gradDate,p.experience,p.skills,p.certificates,p.targetMarkets,p.personalNote,p.familyNote];return Math.round(fields.filter(x=>String(x||'').trim()).length/fields.length*100)}
  const directionOptions=['地产投资与资产管理','估值与交易咨询','金融、信贷与融资','审计、财务与企业分析','商业分析与数据','公共部门与稳定就业','继续升学与研究'];
  const routeOptions=[['job','尽快进入职场'],['study','继续读研 / 读博'],['explore','先实习或转向探索'],['stable','优先选择稳定平台']];
  const familyOptions=[['stability','稳定与福利'],['income','尽快有收入'],['nearhome','留在熟悉的城市'],['study','支持继续升学'],['budget','可承担升学投入'],['mobility','接受异地发展'],['explore','允许试错和探索']];
  const paths=[
    {id:'job',icon:'↗',title:'直接就业 / 校招',subtitle:'以目标岗位和招聘窗口为中心，边投递边补齐证据。',fit:['income','stability','mobility'],pros:['更快获得真实工作反馈','实习经历可以转成面试证据'],risks:['毕业批次、到岗时间和工作许可可能是硬门槛','方向不清时容易海投'],action:'挑 3 个岗位，先核对学历、毕业时间与工作许可'},
    {id:'study',icon:'✳',title:'继续升学 / 专业深化',subtitle:'用更高学历或更强专业训练换取转向机会与长期竞争力。',fit:['study','budget','stability'],pros:['能补充专业深度和校招资格','适合需要研究训练的岗位'],risks:['学费、时间与机会成本更高','升学本身不保证就业结果'],action:'列出 2 个项目，核算成本、录取条件和就业出口'},
    {id:'explore',icon:'⌁',title:'实习探索 / 能力补强',subtitle:'先做短周期试验，用项目或实习验证兴趣和岗位适配。',fit:['explore','income','mobility'],pros:['降低一次性押注的风险','成果可以直接用于简历与面试'],risks:['需要给探索设期限和退出标准','短期收入与确定性可能偏低'],action:'设定 4 周实验：完成一个项目并访谈 2 位从业者'},
    {id:'stable',icon:'▣',title:'稳定平台 / 资格路径',subtitle:'围绕稳定性、地域与长期保障选择公共部门或大型平台。',fit:['stability','nearhome','study'],pros:['路径与准备节奏较明确','对重视保障和地域的人更友好'],risks:['考试和招聘窗口竞争集中','需确认专业目录、资格和应届身份'],action:'核对目标公告的专业目录、应届定义与报名时间'}
  ];
  function familyScore(path){const picked=state.profile.familyPriorities||[];if(!picked.length)return 50;const hits=picked.filter(v=>path.fit.includes(v)).length;return Math.round(45+hits/picked.length*50)}
  function personalScore(path){const p=state.profile;let s=50;const goals=p.routeGoals||[];if(goals.includes(path.id))s+=25;if(path.id==='job'&&String(p.experience||'').trim())s+=8;if(path.id==='explore'&&String(p.experience||'').trim())s+=8;if(path.id==='study'&&String(p.studyBudget||'').trim())s+=6;if(path.id==='stable'&&String(p.targetMarkets||'').trim())s+=4;if(path.id==='job'&&String(p.skills||'').trim())s+=5;if(path.id==='explore'&&goals.includes('study'))s-=2;return Math.max(30,Math.min(91,s))}
  function pathScore(path){const influence=Math.max(0,Math.min(80,Number(state.profile.influence)||0))/100;return Math.round(personalScore(path)*(1-influence)+familyScore(path)*influence)}
  function rankedPaths(){return paths.map(x=>({...x,score:pathScore(x)})).sort((a,b)=>b.score-a.score)}
  function readinessRows(){const p=state.profile;return [
    {id:'education',name:'学历与专业',kind:'硬筛选',evidence:p.degree||p.major?`${p.degree||'学历待填'}${p.major?' · '+p.major:''}。仍需对照岗位规定的学历、专业目录和认证要求。`:'补充最高学历和专业，再逐岗核对学历层级与专业限制。'},
    {id:'graduation',name:'毕业届别与到岗时间',kind:'硬筛选',evidence:p.gradDate?`预计毕业：${p.gradDate}。逐项核对毕业年份、证书取得时间和最早到岗日期。`:'毕业时间会影响应届资格和到岗安排，请补充预计毕业日期。'},
    {id:'authorization',name:'工作许可 / 身份',kind:'硬筛选',evidence:p.workAuth?`${p.workAuth}。按目标国家或地区确认是否需雇主担保、身份或特定签证。`:'记录当前工作许可或身份；跨境求职时逐岗位确认雇主是否支持。'},
    {id:'location',name:'工作地点与流动性',kind:'硬筛选',evidence:p.targetMarkets?`目标地点：${p.targetMarkets}。留意岗位的现场办公、迁居和差旅要求。`:'选择目标国家 / 城市，检查地点是否为岗位的硬性条件。'},
    {id:'academic',name:'成绩 / GPA / 排名',kind:'常见硬筛选',evidence:p.gpa?`${p.gpa}。仅当公告要求时核对最低 GPA、排名算法和成绩单格式。`:'若目标岗位有 GPA 或排名要求，准备成绩单并确认计算口径。'},
    {id:'language',name:'语言要求',kind:'硬筛选 / 岗位条件',evidence:p.language?`${p.language}。需确认岗位要求的语言、考试类型与最低成绩。`:'按目标岗位记录语言要求与可提供的成绩证明。'},
    {id:'skills',name:'技能与工具',kind:'岗位条件',evidence:p.skills?`${p.skills}。将每项技能对应到项目、实习或证书的可验证证据。`:'提取岗位关键词，补充技能工具和实际使用场景。'},
    {id:'qualifications',name:'证书 / 其他资格条件',kind:'硬筛选 / 岗位条件',evidence:p.certificates?`${p.certificates}。核对证书有效期、颁发机构和岗位是否要求。`:'准备岗位要求的职业资格、证书、资格目录或其他必填条件。'},
    {id:'experience',name:'实习 / 项目经历',kind:'简历材料',evidence:p.experience?`${p.experience}。突出你负责的部分、行动和量化结果。`:'至少整理 1 段实习或项目经历，写清任务、行动和结果。'},
    {id:'materials',name:'简历与证明材料',kind:'简历材料',evidence:'检查简历的教育信息、日期、关键词、量化结果、语言证书及证明文件是否一致。'}
  ]}
  function statusLabel(v){return v==='met'?'已满足':v==='gap'?'存在差距':v==='na'?'不适用':'待核实'}
  function statusClass(v){return v==='met'?'met':v==='gap'?'gap':v==='na'?'na':''}
  function completion(){const all=Object.values(state.manualChecks||{});return Math.round(all.filter(x=>x==='met'||x==='na').length/all.length*100)}
  function header(title,desc,button=''){return `<div class="page-head"><div><div class="eyebrow">CAREER COMPASS</div><h1 class="page-title">${title}</h1><p class="page-desc">${desc}</p></div>${button}</div>`}
  function render(){document.getElementById('crumbTitle').textContent=titles[page];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const c=document.getElementById('content');c.innerHTML=page==='overview'?overviewHTML():page==='profile'?profileHTML():page==='paths'?pathsHTML():page==='jobs'?jobsHTML():planHTML();if(page==='profile')bindProfile();if(page==='jobs')renderJobGrid();updateMini()}
  function overviewHTML(){const ranked=rankedPaths(),best=ranked[0],p=state.profile,complete=profileScore(),suggestions=taskSuggestions();const directionCards=[['job','↗','就业准备','把兴趣变成岗位目标，并优先确认校招资格。'],['study','✳','升学评估','比较项目要求、成本和毕业后的岗位出口。'],['explore','⌁','实习探索','用实习和短项目检验方向，不必一次定终身。']];return `${header('把下一步，拆成可验证的选择','综合你的教育、实习、个人意愿与家庭期待，比较就业、升学和探索路径。')}<section class="hero"><div class="hero-copy"><div class="hero-kicker"><i></i>你的选择可以一步一步验证</div><h2>${p.name?esc(p.name)+'，先看清选项，再决定投入。':'不用现在就决定一生，先找到下一步。'}</h2><p>整理你已经拥有的经历，辨认影响选择的条件，再把“想做什么”转换成一组可以行动和复盘的计划。</p><div class="hero-ctas"><button class="btn btn-lime" data-page="profile">${complete?'继续完善画像':'建立我的画像'} <span>→</span></button><button class="btn" data-page="paths">比较路径方案</button></div></div><div class="hero-art" aria-hidden="true"><div class="orbit"><div class="orbit-line"></div><div class="orbit-line two"></div><div class="orbit-center">↗</div><span class="orbit-node n1">教育背景</span><span class="orbit-node n2">个人意愿</span><span class="orbit-node n3">家庭期待</span><span class="orbit-node n4">岗位门槛</span></div></div></section>
    <div class="stat-grid"><div class="stat-card"><div class="stat-top"><span>画像完整度</span><span class="stat-icon">◎</span></div><div class="stat-value">${complete}<span style="font-size:13px">%</span></div><div class="stat-note">填写得越清楚，比较越有依据</div></div><div class="stat-card"><div class="stat-top"><span>已选探索方向</span><span class="stat-icon" style="background:#f1eefb">◇</span></div><div class="stat-value">${(p.directions||[]).length}</div><div class="stat-note">建议先聚焦 2–3 个方向</div></div><div class="stat-card"><div class="stat-top"><span>已整理目标岗位</span><span class="stat-icon" style="background:#fff0e3">▤</span></div><div class="stat-value">${state.jobs.length}</div><div class="stat-note">支持导入招聘筛选表</div></div><div class="stat-card"><div class="stat-top"><span>筛选条件已核对</span><span class="stat-icon" style="background:#eaf2f6">✓</span></div><div class="stat-value">${completion()}<span style="font-size:13px">%</span></div><div class="stat-note">${Object.values(state.manualChecks).filter(x=>x==='gap').length} 项标记为存在差距</div></div></div>
    <div class="grid-2"><section class="panel"><div class="section-row" style="margin-top:0"><div><h2 class="section-title">当前优先验证</h2><div class="section-sub">按你填写的偏好与家庭关注点排序</div></div><button class="text-button" data-page="paths">查看所有方案 →</button></div>${(p.routeGoals||[]).length||p.familyPriorities.length?`<div class="path-spotlight"><div class="path-symbol">${best.icon}</div><div><div class="path-name">${best.title}</div><div class="path-tagline">${best.subtitle}</div><div class="bar"><i style="width:${best.score}%"></i></div></div><div class="score">${best.score}<small>相对匹配</small></div></div><div class="callout"><strong>下一步验证：</strong>${best.action}。分数只用于比较方案，具体选择要看岗位公告、个人约束和实际反馈。</div>`:`<div class="empty-note">完善个人目标和家庭关注点后，这里会显示一条优先验证的路径。当前分数只是基于已填写信息的讨论起点。</div>`}</section><section class="panel"><div class="section-row" style="margin-top:0"><div><h2 class="section-title">现在最有用的一步</h2><div class="section-sub">先完成一个小动作，别让选择停在想象里</div></div></div><div class="next-step"><div class="next-step-label">推荐动作 · 15 分钟</div><h3>${nextAction().title}</h3><p>${nextAction().copy}</p><button class="btn btn-small btn-primary" data-page="${nextAction().page}">现在开始 →</button></div></section></div>

  function nextAction(){const p=state.profile;if(!p.school||!p.degree||!p.major)return{title:'补齐教育背景与预计毕业时间',copy:'毕业批次、专业目录和证书时间会直接影响很多岗位的硬性筛选。',page:'profile'};if(!(p.directions||[]).length)return{title:'选出你愿意先尝试的 2–3 个方向',copy:'不需要现在排除其他可能，只要选出值得投入第一轮验证的方向。',page:'profile'};if(!String(p.experience||'').trim())return{title:'整理一段实习或项目经历',copy:'写下你负责的任务、采取的行动和能证明结果的数字。',page:'profile'};if(!state.jobs.length)return{title:'把招聘公告里的筛选门槛放进来',copy:'导入岗位表或手动新增岗位，核对毕业时间、工作许可和资格要求。',page:'jobs'};return{title:'核对优先岗位的毕业与工作许可要求',copy:'有疑问时联系招聘方确认，把回复和日期记录在自己的材料中。',page:'jobs'}}
  function profileHTML(){const p=state.profile;const chips=(name,opts,values)=>`<div class="choice-list">${opts.map(([v,label])=>`<span class="choice"><input type="checkbox" id="${name}-${v}" name="${name}" value="${v}" ${checked(values,v)}><label for="${name}-${v}">${label}</label></span>`).join('')}</div>`;return `${header('我的画像','把可验证的背景、兴趣、约束与家人关心的事放在一起。','<button class="btn btn-primary" data-action="save-profile">✓ 自动保存</button>')}<div class="profile-layout"><form class="profile-form" id="profileForm" autocomplete="on"><section class="form-section"><div class="form-section-head"><span class="form-number">01</span><div><h3>教育背景</h3><p>记录可能影响学历、专业和毕业批次筛选的信息。</p></div></div><div class="form-grid"><div class="field"><label for="pName">称呼（可选）</label><input id="pName" name="name" value="${fieldValue('name')}" placeholder="如何称呼你"></div><div class="field"><label for="pSchool">学校</label><input id="pSchool" name="school" value="${fieldValue('school')}" placeholder="学校名称"></div><div class="field"><label for="pDegree">最高学历 / 当前学历</label><select id="pDegree" name="degree"><option value="">请选择</option>${['高中 / 中专','大专','本科','硕士','博士','其他'].map(x=>`<option ${p.degree===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="pMajor">专业 / 研究方向</label><input id="pMajor" name="major" value="${fieldValue('major')}" placeholder="例如：金融、计算机、机械工程"></div><div class="field"><label for="pGrad">预计毕业时间</label><input id="pGrad" name="gradDate" value="${fieldValue('gradDate')}" type="month"></div><div class="field"><label for="pGpa">成绩 / GPA（可选）</label><input id="pGpa" name="gpa" value="${fieldValue('gpa')}" placeholder="注明满分制，例如 3.6 / 4.0"></div><div class="field"><label for="pLanguage">语言与成绩</label><input id="pLanguage" name="language" value="${fieldValue('language')}" placeholder="例如：英语商务沟通，IELTS 7.0"></div><div class="field"><label for="pAuth">当前工作许可 / 身份</label><input id="pAuth" name="workAuth" value="${fieldValue('workAuth')}" placeholder="按你愿意记录的范围填写"></div></div></section>
    <section class="form-section"><div class="form-section-head"><span class="form-number">02</span><div><h3>实践经历与能力证据</h3><p>用经历和成果，而不是自我评价，来判断可以迁移的能力。</p></div></div><div class="form-grid"><div class="field full"><label for="pExperience">实习、工作、科研或项目经历</label><textarea id="pExperience" name="experience" placeholder="每段写：单位/项目｜时间｜你负责什么｜采取的行动｜结果或数字&#10;例：商业分析项目｜整理 120 条数据，建立周报模型，使团队节省约 4 小时/周">${fieldValue('experience')}</textarea><span class="field-hint">没有正式实习也可以填写课程项目、社团、竞赛、志愿服务或个人作品。</span></div><div class="field"><label for="pSkills">技能与工具</label><textarea id="pSkills" name="skills" placeholder="列出岗位相关技能，注明熟练程度和使用场景">${fieldValue('skills')}</textarea></div><div class="field"><label for="pCertificates">资格证书</label><textarea id="pCertificates" name="certificates" placeholder="写证书名称、状态和取得时间；没有可留空">${fieldValue('certificates')}</textarea></div></div></section>
    <section class="form-section"><div class="form-section-head"><span class="form-number">03</span><div><h3>个人意愿与工作偏好</h3><p>选择你想先验证的方向，再补充真正重要的工作条件。</p></div></div><div class="form-grid"><div class="field full"><span class="field-label">你愿意优先验证哪些方向？可多选</span>${chips('directions',directionOptions.map(x=>[x,x]),p.directions)}</div><div class="field full"><span class="field-label">你当前更倾向哪条路径？可多选</span>${chips('routeGoals',routeOptions,p.routeGoals)}</div><div class="field"><label for="pMarkets">目标城市 / 国家或地区</label><input id="pMarkets" name="targetMarkets" value="${fieldValue('targetMarkets')}" placeholder="例如：杭州、上海；英国、香港"></div><div class="field"><label for="pSalary">期望薪资 / 生活成本底线</label><input id="pSalary" name="salary" value="${fieldValue('salary')}" placeholder="写区间、税前/税后和币种"></div><div class="field"><label for="pStyle">偏好的工作方式</label><select id="pStyle" name="workStyle"><option value="">请选择或暂不确定</option>${['团队协作、沟通密集','独立分析、深度工作','客户 / 业务一线','研究与专业技术','灵活多变、项目制','稳定流程、边界清晰'].map(x=>`<option ${p.workStyle===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="pRisk">对不确定性的接受度</label><select id="pRisk" name="risk"><option value="">请选择或暂不确定</option>${[['low','偏低：重视稳定和确定性'],['middle','中等：愿意尝试但需有保障'],['high','偏高：愿意为成长承担变化']].map(([v,x])=>`<option value="${v}" ${p.risk===v?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><span class="field-label">你目前最在意的 1–3 件事</span><textarea name="personalNote" placeholder="例如：做有成长空间的工作；有时间照顾家人；在某个城市长期发展；收入尽快独立">${fieldValue('personalNote')}</textarea></div></div></section>

    <section class="form-section"><div class="form-section-head"><span class="form-number">05</span><div><h3>简历筛选基础项</h3><p>先做自查；“已满足”需要你对照具体岗位公告确认。</p></div></div><div class="screen-list">${readinessRows().map(r=>`<div class="screen-row"><div><div class="screen-name">${r.name}</div><div class="screen-kind">${r.kind}</div></div><select data-baseline="${r.id}" aria-label="${r.name}核对状态"><option value="verify" ${state.manualChecks[r.id]==='verify'?'selected':''}>待核实</option><option value="met" ${state.manualChecks[r.id]==='met'?'selected':''}>已满足</option><option value="gap" ${state.manualChecks[r.id]==='gap'?'selected':''}>存在差距</option><option value="na" ${state.manualChecks[r.id]==='na'?'selected':''}>不适用</option></select><div class="screen-evidence">${esc(r.evidence)}</div></div>`).join('')}</div><div class="callout"><strong>硬筛选先核对：</strong>学历 / 专业、毕业批次、工作许可、工作地点、语言及资格证。条件不明确时记录“待核实”，不要把不确定当作通过。</div></section></form>
    <aside class="profile-aside"><div class="aside-card"><h3>画像准备度</h3><p>完整度代表信息是否齐全，不代表你是否够资格。</p><div class="completeness"><div class="ring" style="--pct:${profileScore()}"><b>${profileScore()}%</b></div><div><b style="font-size:11px">${profileScore()<50?'继续整理':profileScore()<85?'信息逐渐清晰':'可以开始比较'}</b><div class="field-hint" style="margin-top:3px">所有内容自动保存到此浏览器</div></div></div><div class="aside-list"><div class="aside-line"><span>个人目标</span><b>${p.directions.length?'已选择 '+p.directions.length+' 项':'待补充'}</b></div><div class="aside-line"><span>家庭关注点</span><b>${p.familyPriorities.length?'已记录 '+p.familyPriorities.length+' 项':'待补充'}</b></div><div class="aside-line"><span>岗位材料</span><b>${state.jobs.length?'已整理 '+state.jobs.length+' 个岗位':'可稍后导入'}</b></div></div></div><div class="aside-card"><h3>怎么判断简历会不会过筛？</h3><p>公司通常先看学历与专业、毕业届别、工作许可、地点、成绩 / 语言、资格证等硬条件，再看实习、技能和成果。岗位间差异很大，画像里的状态需要和每条招聘公告逐项对照。</p><button class="text-button" style="padding:9px 0 0" data-page="jobs">去核对岗位要求 →</button></div><div class="aside-card" style="background:#f9f6ee"><h3>隐私提醒</h3><p>请只填写你愿意保存在当前浏览器的信息。该工具不要求身份证号、家庭收入细目或联系方式。</p></div></aside></div>`}
  function hasPathBasis(){const p=state.profile;return !!(p.routeGoals.length||p.directions.length||p.familyPriorities.length||String(p.experience||'').trim()||String(p.personalNote||'').trim())}
  function pathsHTML(){const ranked=rankedPaths();const rank=ranked[0];const p=state.profile;const hasBasis=hasPathBasis();return `${header('路径方案','把“找工作、继续升学、先探索”放在同一张表里比较。')}<section class="panel" style="margin-bottom:15px"><div class="section-row" style="margin:0"><div><h2 class="section-title">你的比较权重</h2><div class="section-sub">家庭期待影响 ${Number(p.influence)||0}% · 个人偏好影响 ${100-(Number(p.influence)||0)}%</div></div><button class="btn btn-small" data-page="profile">调整画像偏好</button></div><div class="callout" style="margin-top:13px">${hasBasis?`<strong>优先验证建议：</strong>${rank.title}。${rank.action}。这只是根据已填写信息排序，实际录取和岗位结果不在模型可预测范围内。`:'填写个人倾向、职业方向或家庭关注点后，再查看路径排序。当前方案按中性起点呈现，不预设你应该就业或升学。'}</div></section><div class="route-cards">${ranked.map((r,i)=>`<article class="route-card ${hasBasis&&i===0?'recommended':''}"><div class="route-top"><span class="route-icon">${r.icon}</span><div class="route-score">${r.score}<span style="font-size:10px;font-weight:500"> / 100</span></div></div><h3>${r.title}</h3><p>${r.subtitle}</p><div class="route-meta"><span class="pill">个人偏好 ${personalScore(r)}</span><span class="pill blue">家庭适配 ${familyScore(r)}</span>${(p.routeGoals||[]).includes(r.id)?'<span class="pill warn">你已选为意向</span>':''}</div><div class="route-list"><div><i>＋</i><span>${r.pros[0]}</span></div><div><i>＋</i><span>${r.pros[1]}</span></div><div><i>△</i><span>${r.risks[0]}</span></div><div><i>△</i><span>${r.risks[1]}</span></div></div><div class="route-action">下一步：${r.action}</div></article>`).join('')}</div><div class="section-row"><div><h2 class="section-title">职业兴趣方向</h2><div class="section-sub">根据你选出的方向，安排低成本的验证活动</div></div><button class="text-button" data-page="profile">修改选择 →</button></div><section class="panel">${p.directions.length?`<div class="choice-list">${p.directions.map(d=>`<span class="pill" style="font-size:10px;padding:7px 10px">${esc(d)}</span>`).join('')}</div><div class="callout">每个方向各找 3 条近期招聘公告，记录重复出现的学历、日期、语言和技能要求，再看哪条最符合你的兴趣与可行条件。</div>`:`<div class="emp   function jobsHTML(){const button='<div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn" data-action="add-job">＋ 手动添加</button><button class="btn btn-primary" data-action="import">↑ 导入 CSV</button></div>';return `${header('岗位筛选与简历核对','把招聘公告里的必填条件逐项拆开，标记已满足、待核实或存在差距。',button)}<section class="panel" style="margin-bottom:13px"><div style="display:flex;gap:12px;align-items:flex-start"><div class="stat-icon" style="flex:0 0 28px">i</div><div style="font-size:10px;color:#66766e;line-height:1.65"><b style="color:var(--ink)">招聘信息以公告为准。</b> 可导入包含公司、岗位、毕业批次、工作许可、资格说明、招聘状态、来源链接等列的 CSV。导入在浏览器中解析，不会上传文件。过期或未核实的要求请联系招聘方确认。</div></div></section><div class="job-toolbar"><input class="filter-input" id="jobSearch" type="search" placeholder="搜索公司、职位或城市…" value="${esc(state.search||'')}"><select id="marketFilter" aria-label="按市场筛选"><option value="all" ${state.market==='all'?'selected':''}>所有市场</option>${[['mainland','中国内地'],['uk','英国'],['hk','香港'],['other','其他']].map(([v,x])=>`<option value="${v}" ${state.market===v?'selected':''}>${x}</option>`).join('')}</select><select id="jobStatusFilter" aria-label="按岗位状态筛选"><option value="all" ${state.jobFilter==='all'?'selected':''}>全部岗位</option><option value="saved" ${state.jobFilter==='saved'?'selected':''}>只看已收藏</option><option value="verify" ${state.jobFilter==='verify'?'selected':''}>有待核对</option></select><span id="jobCount" style="font-size:10px;color:#8b9890;margin-left:auto"></span></div><div id="jobGrid"></div><p class="footer-note">已上传表格的“简历匹配”或“资格说明”是来源文件中的筛查备注，不等于招聘方承诺。核对结果由你手动标记，本工具不自动判断签证资格或录用概率。</p>`}
  function normalizeMarket(job){const t=((job.market||'')+' '+(job.location||'')).toLowerCase();if(/mainland|中国内地|深圳|上海|北京|杭州|广州|成都|南京|苏州|内地/.test(t))return'mainland';if(/hong kong|香港|hong kong sar/.test(t))return'hk';if(/united kingdom|\buk\b|london|manchester|birmingham|bristol|edinburgh|leeds|英国/.test(t))return'uk';return'other'}
  function statusForJob(job){const t=(job.postingStatus||job.status||'').toLowerCase();if(/closed|截止|已填补|失效|不再|暂停/.test(t))return{label:'疑似已截止',cls:'warn'};if(/open|live|仍在|开放/.test(t))return{label:'来源标为开放',cls:''};return{label:'状态待核实',cls:'gray'}}
  function dateAge(value){if(!value)return null;const m=String(value).match(/(20\d\d)[-/年.](\d{1,2})[-/月.](\d{1,2})?/);if(!m)return null;const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]||1));return Math.floor((new Date()-d)/86400000)}
  function renderJobGrid(){const host=document.getElementById('jobGrid');if(!host)return;let list=state.jobs.filter(j=>{const q=(state.search||'').trim().toLowerCase();const hay=`${j.company} ${j.title} ${j.location} ${j.market}`.toLowerCase();if(q&&!hay.includes(q))return false;if(state.market!=='all'&&normalizeMarket(j)!==state.market)return false;if(state.jobFilter==='saved'&&!state.savedJobs.includes(j.id))return false;if(state.jobFilter==='verify'){const checks=state.jobChecks[j.id]||{};const values=Object.values(checks);if(values.length&&values.every(v=>v==='met'||v==='na'))return false}return true});document.getElementById('jobCount').textContent=`${list.length} / ${state.jobs.length} 个岗位`;if(!state.jobs.length){host.innerHTML=`<div class="empty-jobs"><div class="empty-emoji">▤</div><h3>先把目标岗位放进来</h3><p>上传 CSV 招聘清单，或手动新增岗位。每个岗位可以单独核对学历、毕业时间、工作许可、语言和技能要求。</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" data-action="import">导入岗位 CSV</button><button class="btn" data-action="add-job">手动添加一个岗位</button></div></div>`;return}if(!list.length){host.innerHTML='<div class="empty-note">没有符合当前筛选条件的岗位。试试清空搜索或切换市场。</div>';return}host.innerHTML=`<div class="job-grid">${list.map(j=>{const st=statusForJob(j),age=dateAge(j.checkedDate);const due=age!==null&&age>14?'来源超过两周，请复核':j.checkedDate?`来源：${esc(j.checkedDate)}`:'来源日期未记录';const saved=state.savedJobs.includes(j.id);const manual=state.jobChecks[j.id]||{};const marked=Object.values(manual).filter(v=>v==='met'||v==='na').length;return `<article class="job-card"><div class="job-head"><div><div class="job-company">${esc(j.company)}</div><div class="job-title">${esc(j.title)}</div></div><button class="icon-button" style="width:28px;height:28px;font-size:14px" data-action="favorite" data-id="${esc(j.id)}" aria-label="${saved?'取消收藏':'收藏岗位'}">${saved?'★':'☆'}</button></div><div class="job-badges"><span class="pill ${st.cls}">${st.label}</span>${j.family?`<span class="pill blu   function safeUrl(v){try{const u=new URL(v,location.href);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
  function splitCriteria(text){return String(text||'').split(/[\n;；。]+/).map(x=>x.trim()).filter(Boolean).slice(0,12)}

  function screenDialog(job){const saved=state.jobChecks[job.id]||{};const all=[];checkLabels.forEach(([id,label])=>{let detail='';if(id==='education')detail=job.eligibility||job.requirements||'';if(id==='graduation')detail=job.graduation||'';if(id==='authorization')detail=job.workAuth||'';if(id==='language'||id==='skills')detail=job.requirements||'';if(id==='location')detail=job.location?`招聘地点：${job.location}`:'';all.push({id,label,detail:detail||'招聘信息没有提供明确细则；请打开官方公告确认。'})});const list=all.map(x=>`<div class="criteria-control"><div><b>${x.label}</b><p>${esc(x.detail)}</p></div><select data-check="${x.id}" data-job="${esc(job.id)}"><option value="verify" ${(!saved[x.id]||saved[x.id]==='verify')?'selected':''}>待核实</option><option value="met" ${saved[x.id]==='met'?'selected':''}>已满足</option><option value="gap" ${saved[x.id]==='gap'?'selected':''}>存在差距</option><option value="na" ${saved[x.id]==='na'?'selected':''}>不适用</option></select></div>`).join('');document.getElementById('screenDialogBody').innerHTML=`<div class="modal-head"><div><div class="eyebrow">岗位核对清单</div><h2>${esc(job.company)} · ${esc(job.title)}</h2><p>${esc(job.location||job.market||'地点待补充')}　｜　来源日期：${esc(job.checkedDate||'未记录')}</p></div><button class="icon-button" data-action="close-screen" aria-label="关闭">×</button></div><div class="job-detail-grid"><div class="detail-item"><b>招聘状态</b><span>${esc(job.postingStatus||job.status||'未记录；需打开官方招聘页确认')}</span></div><div class="detail-item"><b>毕业 / 到岗筛查</b><span>${esc(job.graduation||'公告未提供明确条件，请向招聘方确认。')}</span></div><div class="detail-item"><b>身份 / 工作许可筛查</b><span>${esc(job.workAuth||'公告未提供明确条件，请向招聘方确认。')}</span></div><div class="detail-item"><b>来源文件适配备注</b><span>${esc(job.fitSource||job.eligibility||'无来源备注。')}</span></div></div>${job.requirements?`<div class="modal-note"><b>岗位必填条件：</b><br>${esc(job.requirements)}</div>`:''}<div class="modal-criteria">${list}</div><div class="modal-note">“已满足”由你根据个人资料与公告手动标记。对于专业目录、毕业届别、工作许可或要求不清楚的条件，请联系招聘方确认并记录确认日期。</div>   function pathsForProfile(){return state.profile.directions||[]}
  function planHTML(){const suggestions=taskSuggestions();const week1=suggestions.slice(0,3),week2=suggestions.slice(3,6),week3=suggestions.slice(6,9);const done=state.doneTasks.length;const total=suggestions.length;const week=(label,title,tasks)=>`<section class="week-card"><div class="week-label">${label}</div><h3>${title}</h3><div class="task-list">${tasks.map(t=>`<label class="task-item ${state.doneTasks.includes(t.id)?'done':''}"><input type="checkbox" data-taskcheck="${t.id}" ${state.doneTasks.includes(t.id)?'checked':''}><span>${esc(t.title)}</span></label>`).join('')}</div></section>`;return `${header('行动计划','把模糊的大问题拆成 30 天内可完成、可复盘的小步骤。')}<section class="panel" style="margin-bottom:14px"><div class="section-row" style="margin:0"><div><h2 class="section-title">本轮验证进度</h2><div class="section-sub">${done} / ${total} 项完成 · 改变目标时可以重新安排</div></div><span class="pill">基于你的当前画像</span></div><div class="progress-strip"><i style="width:${Math.round(done/Math.max(total,1)*100)}%"></i></div></section><div class="task-board">${week('第 1 周','厘清底线与门槛',week1)}${week('第 2 周','准备证据与作品',week2)}${week('第 3–4 周','行动、复盘、调整',week3)}</div><div class="section-row"><div><h2 class="section-title">给自己加一项任务</h2><div class="section-sub">计划应服务于你，而不是变成另一份压力清单</div></div></div><section class="panel"><div class="add-task"><input id="customTask" placeholder="例如：周五前向校友了解岗位日常" maxlength="120"><button class="btn btn-primary" data-action="add-task">添加任务</button></div><div class="task-list" style="margin-top:14px">${(state.customTasks||[]).map(t=>`<label class="task-item ${t.done?'done':''}"><input type="checkbox" data-customtask="${esc(t.id)}" ${t.done?'checked':''}><span>${esc(t.title)}</span><button type="button" class="text-button" data-action="delete-task" data-id="${esc(t.id)}">删除</button></label>`).join('')||'<div class="field-hint">你的自定义任务会保存在本地档案中。</div>'}</div></section><div class="callout"><strong>复盘提示：</strong>每周记录一条新证据、一项仍不确定的条件和一个下一步动作。如果计划与真实情况不符，调整计划，不要把模型排序当作必须完成的路线。</div>`}
  function taskSuggestions(){const p=state.profile;const items=[];if(!p.school||!p.degree||!p.major)items.push({id:'t-edu',title:'补齐学校、学历、专业和毕业时间'});else items.push({id:'t-grad',title:'找 3 个目标岗位核对毕业届别与到岗日期'});if(!p.directions.length)items.push({id:'t-dir',title:'从兴趣、能力和约束中选出 2–3 个探索方向'});else items.push({id:'t-inform',title:`为“${p.directions[0]}”收集 3 条近期招聘公告`});if(!String(p.experience||'').trim())items.push({id:'t-exp',title:'整理一段实习、科研或项目经历，用行动和结果描述'});else items.push({id:'t-proof',title:'把一段经历改写成带成果数字的简历要点'});if(!p.familyPriorities.length)items.push({id:'t-family',title:'和家人分别写下各自最在意的 2 个条件'});else items.push({id:'t-talk',title:'和家人讨论一个共同底线和一个可试验空间'});if(!state.jobs.length)items.push({id:'t-jobs',title:'导入岗位表，或新增 3 个真实目标岗位'});else items.push({id:'t-check',title:'逐岗核对学历、毕业时间、工作许可和语言要求'});items.push({id:'t-network',title:'联系 2 位校友或从业者，了解真实工作内容'});items.push({id:'t-review',title:'一周后复盘：哪条路径有新证据？哪项条件仍不确定？'});return items}
  function bindProfile(){const form=document.getElementById('profileForm');if(!form)return;const sync=()=>{const fd=new FormData(form);for(const k of ['name','school','degree','major','gradDate','gpa','language','workAuth','experience','skills','certificates','targetMarkets','salary','studyBudget','workStyle','risk','personalNote','familyNote'])state.profile[k]=fd.get(k)||'';for(const k of ['directions','routeGoals','familyPriorities'])state.profile[k]=fd.getAll(k);state.profile.influence=Number(fd.get('influence')||0);document.getElementById('influenceValue').textContent=state.profile.influence;save()};form.addEventListener('input',sync);form.addEventListener('change',sync)}
  function parseCsv(text){text=String(text||'').replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"'){quoted=true}else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);if(row.some(x=>String(x).trim()))rows.push(row);row=[];cell=''}else if(c!=='\r'){cell+=c}}row.push(cell);if(row.some(x=>String(x).trim()))rows.push(row);if(rows.length<2)return[];const headers=rows[0].map(x=>String(x).trim());const pick=(o,names)=>{for(const n of names){const key=Object.keys(o).find(k=>k.toLowerCase()===n.toLowerCase());if(key&&String(o[key]||'').trim())return String(o[key]).trim()}return''};return rows.slice(1).map((cells,index)=>{const o={};headers.forEach((h,i)=>o[h]=cells[i]||'');const company=pick(o,['Employer Name','Employer','Company','Company Name','公司','公司名称']);const title=pick(o,['Job Title','Role','Position','职位','岗位名称']);if(!company&&!title)return null;const market=pick(o,['Market Priority','Market','市场']);const location=pick(o,['Location','地点','城市']);return{id:'csv-'+index+'-'+(company+'-'+title).replace(/[^\w\u4e00-\u9fa5]+/g,'-').slice(0,45),company:company||'公司待补充',title:title||'岗位待补充',market,location,deadline:pick(o,['Application Deadline','Deadline','截止日期']),link:pick(o,['Application Link','Application URL','URL','招聘链接','申请链接']),status:pick(o,['Application Status / Source Check Date','Application Status','招聘状态']),postingStatus:pick(o,['Posting Status / latest source status','Posting Status','最新状态']),eligibility:pick(o,['Eligibility / Candidate Notes','Eligibility','资格要求','候选人备注']),graduation:pick(o,['Graduation / Start-date Screen','Graduation / Start date','毕业/入职时间筛选']),workAuth:pick(o,['International Work-authorization Screen','Work Authorization Screen','工作许可筛查']),fitSource:pick(o,['Resume Match (screen)','Recommendation for Candidate','适配建议']),family:pick(o,['Role Family (expanded scope)','Role Family','岗位类别']),requirements:pick(o,['Required Qualifications','Requirements','Mandatory Requirements','必备条件','Qualifications','筛选必填条件']),checkedDate:pick(o,['Source checked date','Source check date','Checked Date','来源核对日期'])}}).filter(Boolean)}
  function getJob(id){return state.jobs.find(j=>j.id===id)}
  function importCsv(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const jobs=parseCsv(reader.result);if(!jobs.length){toast('没有识别到岗位数据，请检查 CSV 列名');return}const seen=new Set(state.jobs.map(j=>(j.company+'|'+j.title).toLowerCase()));const fresh=jobs.filter(j=>!seen.has((j.company+'|'+j.title).toLowerCase()));state.jobs=[...state.jobs,...fresh];save();render();toast(`已从 ${file.name} 导入 ${fresh.length} 个岗位`)}catch(e){toast('读取失败，请另存为 UTF-8 CSV 后重试')}};reader.readAsText(file,'UTF-8')}

  function toggleTask(id){state.doneTasks=state.doneTasks.includes(id)?state.doneTasks.filter(x=>x!==id):[...state.doneTasks,id];save();render()}
  function doPrint(){document.querySelectorAll('.page').forEach(x=>x.classList.remove('printing'));window.print()}
  document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){e.preventDefault();navTo(nav.dataset.page);return}const action=e.target.closest('[data-action]');if(action){const id=action.dataset.id;switch(action.dataset.action){case'print':doPrint();break;case'import':document.getElementById('csvFile').click();break;case'add-job':document.getElementById('newJobDialog').showModal();break;case'close-job':document.getElementById('newJobDialog').close();break;case'close-screen':document.getElementById('screenDialog').close();break;case'favorite':toggleFavorite(id);break;case'screen':const job=getJob(id);if(job)screenDialog(job);break;case'save-profile':save();toast('画像已保存到当前浏览器');break;case'add-task':{const input=document.getElementById('customTask'),title=input.value.trim();if(!title){toast('先写下要完成的动作');break}state.customTasks=state.customTasks||[];state.customTasks.push({id:'custom-'+Date.now(),title,done:false});save();render();toast('任务已添加');break}case'delete-task':state.customTasks=(state.customTasks||[]).filter(t=>t.id!==id);save();render();break}return}const task=e.target.closest('[data-task]');if(task)toggleTask(task.dataset.task)});
  document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-task]')){e.preventDefault();toggleTask(e.target.dataset.task)}});
  document.addEventListener('input',e=>{if(e.target.id==='jobSearch'){state.search=e.target.value;save();renderJobGrid()}});
  document.addEventListener('change',e=>{if(e.target.id==='csvFile'){importCsv(e.target.files[0]);e.target.value=''}else if(e.target.id==='marketFilter'){state.market=e.target.value;save();renderJobGrid()}else if(e.target.id==='jobStatusFilter'){state.jobFilter=e.target.value;save();renderJobGrid()}else if(e.target.dataset.check&&e.target.dataset.job){const j=e.target.dataset.job;state.jobChecks[j]=state.jobChecks[j]||{};state.jobChecks[j][e.target.dataset.check]=e.target.value;save();renderJobGrid()}else if(e.target.dataset.baseline){state.manualChecks[e.target.dataset.baseline]=e.target.value;save();render()}else if(e.target.dataset.taskcheck){const id=e.target.dataset.taskcheck;state.doneTasks=e.target.checked?[...new Set([...state.doneTasks,id])]:state.doneTasks.filter(x=>x!==id);save();render()}else if(e.target.dataset.customtask){const t=(state.customTasks||[]).find(x=>x.id===e.target.dataset.customtask);if(t)t.done=e.target.checked;save();render()}else if(e.target.name&&e.target.closest('#profileForm')){save()}});
  document.addEventListener('submit',e=>{if(e.target.id==='newJobForm'){e.preventDefault();addJob(e.target)}});
  document.getElementById('screenDialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});document.getElementById('newJobDialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
  window.addEventListener('beforeprint',()=>document.getElementById('content').classList.add('printing'));window.addEventListener('afterprint',()=>document.getElementById('content').classList.remove('printing'));
  render();
</script>
<script src="planner-enhancements.js"></script>
</body>
</html>
